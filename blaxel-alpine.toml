# Blaxel Sandbox Configuration for agentsh (Alpine)
# Smaller image but limited security (no shell shim)
#
# NOTE: Alpine variant does NOT intercept shell commands due to BusyBox
# incompatibility. Use Debian variant for full security.

type = "sandbox"
name = "agentsh-blaxel-alpine"

[runtime]
# Use mk3 for ultra-fast cold starts
generation = "mk3"
# 4GB memory for comfortable operation
memory = 4096
# NOTE: Blaxel always uses ./Dockerfile — to deploy Alpine,
# swap Dockerfile.alpine into place (see test-alpine.ts)

# agentsh server port
[[runtime.ports]]
name = "agentsh"
target = 18080
protocol = "tcp"

# sandbox API port
[[runtime.ports]]
name = "sandbox-api"
target = 8080
protocol = "tcp"
