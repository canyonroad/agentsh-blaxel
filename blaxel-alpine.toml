# Blaxel Sandbox Configuration for agentsh (Alpine)
# Alpine-based variant with full security parity with Debian.
# Uses musl libc with statically-linked libseccomp.
#
# NOTE: Blaxel always uses ./Dockerfile — to deploy Alpine,
# swap Dockerfile.alpine into place (see test-alpine.ts).

type = "sandbox"
name = "agentsh-blaxel-alpine"

[runtime]
# Use mk3 for ultra-fast cold starts
generation = "mk3"
# 4GB memory for comfortable operation
memory = 4096
# agentsh server port
[[runtime.ports]]
name = "agentsh"
target = 18080
protocol = "tcp"

# sandbox API port
[[runtime.ports]]
name = "sandbox-api"
target = 8080
protocol = "tcp"
