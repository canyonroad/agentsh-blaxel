# agentsh Server Configuration for Blaxel Sandbox
# Optimized for containerized AI agent environments (v0.20.2)

# Security settings from agentsh detect
security:
  mode: "full"      # seccomp + eBPF + FUSE (v0.16.8 fix: EPERM instead of KILL)
  strict: true

capabilities:
  allow: []

server:
  http:
    addr: "127.0.0.1:18080"
    read_timeout: "30s"
    write_timeout: "5m"
  grpc:
    enabled: false

auth:
  type: "none"

logging:
  level: "info"
  format: "text"
  output: "stderr"

sessions:
  base_dir: "/var/lib/agentsh/sessions"
  max_sessions: 100
  default_timeout: "1h"
  default_idle_timeout: "15m"
  cleanup_interval: "5m"

audit:
  enabled: true
  storage:
    sqlite_path: "/var/lib/agentsh/events.db"

sandbox:
  # env_inject: Environment variables injected into all commands
  # These bypass env policy filtering (operator-trusted)
  # Primary use: BASH_ENV to disable bash builtins that bypass seccomp
  #
  # agentsh 0.20.2 (PR #380, fixes #374): env_inject is now applied on the
  # wrap-init/kernel-install (unixwrap) shim path, so these reach executed
  # commands again. (On 0.20.1 the unixwrap path ignored env_inject, which we
  # had worked around with an entrypoint export — no longer needed.)
  env_inject:
    BASH_ENV: "/usr/lib/agentsh/bash_startup.sh"
    OTEL_SERVICE_NAME: "agentsh-blaxel"
    OTEL_TRACES_EXPORTER: "otlp"

  # Enforce env_policy (allow/deny from default.yaml) on commands run through
  # the wrap/unixwrap shim path (agentsh 0.20.2, PR #387 / #379). Opt-in;
  # default off. Without it the wrap path leaks sandbox-api's full environment
  # (BL_*, NODE_VERSION, …) into commands. With it, only the env_policy allow
  # list passes (AGENTSH_*, BASH_ENV, OTEL_*, HOME, PATH, … are preserved) and
  # the deny list (AWS_*, *_TOKEN, LD_*, …) is stripped — defense-in-depth.
  # env_inject values above are operator-trusted and bypass this filtering.
  wrap_env_policy:
    enabled: true

  # FUSE filesystem interception (requires FUSE support)
  # Deferred: mount on first exec, not at startup. Survives container
  # freeze/thaw (Blaxel standby) — if re-mount fails, degrades gracefully.
  fuse:
    enabled: true
    mount_base_dir: "/var/lib/agentsh/sessions"
    audit:
      enabled: true
      mode: "monitor"

  # Network interception
  network:
    enabled: true
    intercept_mode: "all"
    proxy_listen_addr: "127.0.0.1:0"

  # cgroups resource enforcement
  # Note: Requires cgroup v2 and write access to cgroup filesystem
  cgroups:
    enabled: false  # Keep disabled - read-only cgroup fs in containers

  # Unix sockets wrapper settings (seccomp enforcement)
  # REQUIRED for command blocking to work - wraps commands with agentsh-unixwrap
  unix_sockets:
    enabled: true

  # Seccomp syscall filtering
  # Enables command_rules enforcement at syscall level
  seccomp:
    enabled: true
    mode: "enforce"
    # Opaque sh -c handling (agentsh 0.20.2, PR #386 / fixes #378).
    # Blaxel's sandbox-api always runs `/bin/sh -c "<command>"`. "enforce" runs
    # scripts the shim cannot statically resolve (pipes, redirects, $-expansion,
    # &&, ;, globs) through the wrapped shell WITH per-exec interception, so the
    # inner commands are still policy-checked. (0.20.1 had no knob and
    # fail-closed every such script as shellc-opaque-script.)
    # Values: deny (block) | enforce (run under per-exec policy) | allow (run, no enforcement).
    # enforce is the 0.20.2 default; pinned here to document intent.
    shellc:
      opaque: enforce
    syscalls:
      default_action: "allow"
      on_block: "errno"
    execve:
      enabled: true
      # Debian .deb installs agentsh under /usr/bin, while tarball/musl
      # installs use /usr/local/bin. Bypass both internal tool locations so
      # seccomp execve interception never traps agentsh's own control path.
      internal_bypass:
        - "/usr/bin/agentsh"
        - "/usr/bin/agentsh-unixwrap"
        - "/usr/local/bin/agentsh"
        - "/usr/local/bin/agentsh-unixwrap"
    # File I/O interception via seccomp-notify
    file_monitor:
      # FUSE is the primary file policy layer in this Blaxel integration.
      # Keep the seccomp file monitor off; on Alpine/musl under Blaxel
      # v0.20.2 it can leave the agentsh server unresponsive mid-suite.
      enabled: false
      enforce_without_fuse: false
      intercept_metadata: false

  # Resource limits enforced at sandbox level
  limits:
    max_memory_mb: 2048
    max_cpu_percent: 50
    max_processes: 100

# =============================================================================
# POLICIES
# =============================================================================

policies:
  dir: "/etc/agentsh/policies"
  default: "default"
  allowed:
    - "default"

# =============================================================================
# APPROVALS
# =============================================================================

approvals:
  enabled: false  # Disable approvals for sandbox (no TTY available)
  mode: "local_tty"
  timeout: "1s"

# =============================================================================
# HEALTH & METRICS
# =============================================================================

health:
  path: "/health"
  readiness_path: "/ready"

metrics:
  enabled: true
  path: "/metrics"

# =============================================================================
# LLM PROXY - Intercept LLM API requests for auditing and DLP
# =============================================================================

proxy:
  mode: "embedded"
  port: 0

  providers:
    anthropic: "https://api.anthropic.com"
    openai: "https://api.openai.com"

# =============================================================================
# DLP (Data Loss Prevention) - Redact sensitive data from outputs
# =============================================================================

dlp:
  mode: "redact"

  patterns:
    email: true
    phone: true
    credit_card: true
    ssn: true
    api_keys: true

  custom_patterns:
    - name: openai_key
      display: "[OPENAI_KEY]"
      regex: "sk-[a-zA-Z0-9]{48,}"
      action: redact

    - name: anthropic_key
      display: "[ANTHROPIC_KEY]"
      regex: "sk-ant-[a-zA-Z0-9-]{95,}"
      action: redact

    - name: aws_access_key
      display: "[AWS_KEY]"
      regex: "AKIA[0-9A-Z]{16}"
      action: redact

    - name: github_pat
      display: "[GITHUB_TOKEN]"
      regex: "ghp_[a-zA-Z0-9]{36}"
      action: redact

    - name: github_oauth
      display: "[GITHUB_OAUTH]"
      regex: "gho_[a-zA-Z0-9]{36}"
      action: redact

    - name: jwt_token
      display: "[JWT]"
      regex: "eyJ[a-zA-Z0-9_-]*\\.eyJ[a-zA-Z0-9_-]*\\.[a-zA-Z0-9_-]*"
      action: redact

    - name: private_key
      display: "[PRIVATE_KEY]"
      regex: "-----BEGIN [A-Z]+ PRIVATE KEY-----"
      action: block

    - name: slack_token
      display: "[SLACK_TOKEN]"
      regex: "xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}"
      action: redact

    - name: database_url
      display: "[DATABASE_URL]"
      regex: "(postgres|mysql|mongodb|redis)://[^\\s]+"
      action: redact

    - name: bearer_token
      display: "[BEARER_TOKEN]"
      regex: "Bearer\\s+[a-zA-Z0-9_-]{20,}"
      action: redact

  redact_files:
    - "**/.env"
    - "**/.env.*"
    - "**/credentials*"
    - "**/*secret*"
    - "**/*.pem"
    - "**/*.key"

# =============================================================================
# DEVELOPMENT SETTINGS
# =============================================================================

development:
  disable_auth: true
